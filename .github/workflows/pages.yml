name: Publish website

on:
  push:
    branches: [main]
  schedule:
    # Daily at 08:17 UTC (just after midnight Pacific) so seasonal themes change automatically.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional date (YYYY-MM-DD) to preview a seasonal theme'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.changed.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate static website and seasonal themes
        run: node --test tests/site.test.mjs tests/seasonal-theme.test.mjs
      - name: Apply seasonal theme
        id: theme
        env:
          SEASON_DATE: ${{ inputs.date }}
        run: node scripts/seasonal-theme.mjs --source site --out _site
      - name: Validate themed website
        env:
          SITE_DIR: _site
        run: node --test tests/site.test.mjs
      - name: Skip unchanged scheduled deployments
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          SEASON: ${{ steps.theme.outputs.season }}
        run: |
          live=$( (curl -fsSL https://dennispadia.github.io/ | grep -o 'data-season="[^"]*"' | head -n 1 | cut -d '"' -f 2) || true )
          echo "Live theme: ${live:-none}; built theme: $SEASON"
          if [ "$EVENT" = "schedule" ] && [ "$live" = "$SEASON" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  keepalive:
    # GitHub disables schedules after 60 days without repository activity; re-enabling keeps them running.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the seasonal schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
